name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
    # Feature branches are covered by their pull_request run; pushing to a PR
    # branch otherwise fires this whole workflow twice (the concurrency group
    # cannot dedupe it: push refs/heads/<branch> vs pull refs/pull/<n>/merge).
    branches: ["dev", "main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables keep file:line in backtraces; full debuginfo roughly doubles a
  # test build's target dir, and every job's cache has to fit the 10 GB repo
  # budget at once.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # A release-plz bump changes workspace versions and the changelog and
  # nothing else, so it cannot change what a compiler, a test or an audit
  # observes beyond the version string, and the jobs that build or audit the
  # crate skip it. The script reads the diff rather than the branch name:
  # code pushed onto a release branch runs every job. A job skipped by `if:` reports success.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.bump.outputs.only != 'true' }}
      edges: ${{ steps.edges.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version-only diff
        id: bump
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          only=$(python3 -I .github/scripts/version-only.py "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          echo "only=$only" >> "$GITHUB_OUTPUT"
      # The minimal-consumer job reads only manifests (the dependency edges and features it
      # resolves), its own fixture and this workflow.
      - name: Dependency edges touched
        id: edges
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] \
            || git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD" \
              | grep -Eq '(^|/)Cargo\.toml$|^ci/minimal-consumer/|^\.github/workflows/ci\.yml$'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # No build cache: formatting compiles nothing. Clippy runs in the Test
      # workflow's native jobs, whose `--workspace` run covers this crate.
      - run: cargo fmt --all -- --check

  wasm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # The wasm32 build the test.yml wasm jobs cache under the same key.
          shared-key: ci-wasm
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - run: cargo build -p skyzen --target wasm32-unknown-unknown

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Coverage
    runs-on: ubuntu-latest
    env:
      # Coverage reads the instrumentation's own mapping, not debuginfo, so
      # this build needs none and its cache entry is smaller.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-coverage
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      # The native TLS tests assert kernel TLS on Linux.
      - run: sudo modprobe tls
      - name: Select features
        run: echo "FEATURES=$(bash .github/scripts/ci-features.sh)" >> "$GITHUB_ENV"
      - run: cargo llvm-cov nextest ${{ env.FEATURES }} --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          fail_ci_if_error: true

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No build cache: this job compiles nothing.
      - name: Generate Lockfile
        run: cargo generate-lockfile
      # cargo-audit itself is the gate: it reads `.cargo/audit.toml` and exits
      # non-zero on a vulnerability. The rustsec/audit-check reporter's Check-API
      # update answers 404 on pull requests, failing clean audits.
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  unused-deps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No build cache: cargo-machete reads manifests and sources, it compiles nothing.
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  feature-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-features
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-hack
      # `--workspace` gives every member its own feature matrix; without it
      # cargo-hack drives the root package's features while cargo still builds
      # all default members, so member-specific combinations go unchecked.
      # `http3` and `tls-native-tls` cannot share a Linux binary (see
      # .github/scripts/ci-features.sh), so the all-features pass is the
      # selection that script makes rather than cargo-hack's own.
      - run: cargo hack check --workspace --each-feature --exclude-all-features --no-dev-deps
      - name: Select features
        run: echo "FEATURES=$(bash .github/scripts/ci-features.sh --per-package)" >> "$GITHUB_ENV"
      - run: cargo hack check --workspace --no-dev-deps ${{ env.FEATURES }}
      # `skyzen` alone has 14 non-default features, so an unbounded powerset is
      # over 16k `cargo check` runs. Depth 2 covers every pair (~180 runs).
      - run: cargo hack check --workspace --feature-powerset --depth 2 --no-dev-deps --mutually-exclusive-features http3,tls-native-tls

  # An HTTP application that uses SQLite on tokio must not compile another database driver,
  # async-std or native-tls: those come in only through the skyzen features that name them.
  minimal-consumer:
    needs: changes
    if: needs.changes.outputs.edges == 'true'
    name: Minimal consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ci/minimal-consumer
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - name: Build
        run: cargo build --manifest-path ci/minimal-consumer/Cargo.toml
      - name: Dependency tree carries no other driver, runtime or TLS backend
        run: |
          tree=$(cargo tree --manifest-path ci/minimal-consumer/Cargo.toml -e all --target all --prefix none)
          if echo "$tree" | grep -E '^(sqlx-mysql|sqlx-postgres|async-std|native-tls) '; then
            echo "::error::the minimal consumer's tree carries a crate it did not ask for"
            exit 1
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test
    uses: ./.github/workflows/test.yml
