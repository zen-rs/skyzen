name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
    # Feature branches are covered by their pull_request run; pushing to a PR
    # branch otherwise fires this whole workflow twice (the concurrency group
    # cannot dedupe it: push refs/heads/<branch> vs pull refs/pull/<n>/merge).
    branches: ["dev", "main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release-plz bump changes workspace versions and the changelog and
  # nothing else, so it cannot change what a compiler, a test or an audit
  # observes beyond the version string, and the jobs that build or audit the
  # crate skip it. Typos still reads the changelog it wrote. The script reads
  # the diff rather than the branch name: code pushed onto a release branch
  # runs every job. A job skipped by `if:` reports success.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.bump.outputs.only != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version-only diff
        id: bump
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          only=$(python3 -I .github/scripts/version-only.py "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          echo "only=$only" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  wasm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - run: cargo build -p skyzen --target wasm32-unknown-unknown

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          fail_ci_if_error: true

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: crate-ci/typos@v1

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - name: Generate Lockfile
        run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  unused-deps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  feature-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
          # Only dev pushes save. Caches are branch-scoped, and a ~5 GiB save
          # per run against a 10 GiB repo budget was evicting entries before
          # the next run could restore them. Non-dev runs restore the
          # default-branch entry (restore-only) instead of writing their own.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-hack
      # `--workspace` gives every member its own feature matrix; without it
      # cargo-hack drives the root package's features while cargo still builds
      # all default members, so member-specific combinations go unchecked.
      - run: cargo hack check --workspace --each-feature --no-dev-deps
      # `skyzen` alone has 14 non-default features, so an unbounded powerset is
      # over 16k `cargo check` runs. Depth 2 covers every pair (~180 runs).
      - run: cargo hack check --workspace --feature-powerset --depth 2 --no-dev-deps

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test
    uses: ./.github/workflows/test.yml
