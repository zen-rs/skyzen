name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Publish prepared releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      # The dispatch below creates a workflow_dispatch on binaries.yml.
      actions: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      # release-plz acts as the release GitHub App, not as GITHUB_TOKEN: a
      # tag, branch or pull request made under GITHUB_TOKEN triggers no
      # workflow, so the version pull request would carry no checks and the
      # tag would build no binaries. The installation token is minted per
      # run from the App's private key and expires with the job.
      - uses: actions/create-github-app-token@v2
        id: release-app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN (trusted publishing is
      # configured per crate on crates.io).
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - name: Publish releases
        uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      # A `skyzen-cli` release needs its cargo-dist binaries built on the tag
      # release-plz just pushed; binaries.yml takes the tag by dispatch.
      - name: Dispatch binary builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          echo "${RELEASES:-[]}" | jq -r '.[] | select(.package_name == "skyzen-cli") | .tag // ("skyzen-cli-v" + .version)' |
          while read -r tag; do
            gh workflow run binaries.yml -f "tag=$tag"
          done

  release-pr:
    name: Prepare release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v2
        id: release-app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare release pull request
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}

