[workspace]
members = ["core", "h1", "hyper", "lambda", "macros", "manifest", "services", "test", "redis", "s3", "cloudflare", "cloudflare-admin", "aws", "azure", "cli", "examples/queue-consumer"]
# cloudflare is wasm32-only — exclude from default builds, build with:
#   cargo check -p skyzen-cloudflare --target wasm32-unknown-unknown
default-members = ["core", "h1", "hyper", "lambda", "macros", "manifest", "services", "test", "redis", "s3", "cloudflare-admin", "aws", "azure", "cli", "examples/queue-consumer", "."]
resolver = "2"

[workspace.dependencies]
skyzen-core = { path = "core", version = "0.3.0" }
skyzen-macros = { path = "macros", version = "0.6.1" }
skyzen-manifest = { path = "manifest", version = "0.2.2" }
# No default features: a database driver, sqlx runtime or TLS backend is reached only through the
# feature of the crate that wants it, so an HTTP-only consumer compiles none of them.
skyzen-services = { path = "services", version = "0.4.0", default-features = false }
skyzen-test = { path = "test", version = "0.4.0" }
skyzen-redis = { path = "redis", version = "0.4.0" }
skyzen-s3 = { path = "s3", version = "0.4.0" }

# http-kit is taken from git because its main carries the compio fork's incremental buffer ring;
# every compio crate in the workspace names the same fork branch, so the lockfile holds one copy.
compio = { git = "https://github.com/lexoliu/compio", branch = "skyzen", default-features = false }
http-kit = { git = "https://github.com/zen-rs/http-kit", branch = "main" }
http-kit-io = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false }
http-kit-h1 = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false }
executor-core = { git = "https://github.com/lexoliu/executor-core", branch = "deps/22-compio-fork", default-features = false, features = ["std", "async-executor"] }
skyzen-hyper = { path = "hyper", version = "0.3.0" }
skyzen-h1 = { path = "h1", version = "0.1.0" }
skyzen-lambda = { path = "lambda", version = "0.3.0" }
tracing = "0.1.44"
skyzen = { path = ".", version = "0.6.1" }
smol = "2.0"
async-executor = "1.13"
async-io = "2.6"
async-net = "2.0"
ctrlc = "3.5"

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
rust.unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
clippy.multiple_crate_versions = { level = "allow", priority = 1 }
# Endpoints, middleware and the servers that drive them run on one thread and return `!Send`
# futures by design (AGENTS.md §2a); this lint would flag every one of them.
clippy.future_not_send = { level = "allow", priority = 1 }

# `skyzen-cli` is the installable toolchain, and a source `cargo install` costs
# ~20 minutes of compile per consumer (CI runners included). cargo-dist builds
# per-target binaries on every `v<version>` tag and attaches them to the
# GitHub Release, so `cargo binstall skyzen-cli` and the shell/powershell
# installers resolve to a download instead.
#
# `dist generate` emits `.github/workflows/release.yml`; that path belongs to
# release-plz (the crates.io trusted publisher binds the filename), so the
# generated file is checked in as `.github/workflows/binaries.yml` and `ci` is
# marked allow-dirty — dist's freshness check would otherwise fail every run on
# the deliberate rename. To regenerate: drop the `allow-dirty` line, run
# `dist generate`, rename the emitted file to `binaries.yml`, restore the line.
[workspace.metadata.dist]
cargo-dist-version = "0.34.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
precise-builds = true
pr-run-mode = "plan"
github-attestations = true
allow-dirty = ["ci"]

# The profile `dist build` compiles with; without it every binaries job
# fails with "profile `dist` is not defined".
[profile.dist]
inherits = "release"
lto = "thin"

[package]
name = "skyzen"
version = "0.6.1"
edition = "2021"
description = "A fast, ergonomic HTTP framework that works everywhere"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["http", "web", "framework"]
categories = ["web-programming::http-server"]

[dependencies]
skyzen-core.workspace = true
skyzen-services.workspace = true
http-kit.workspace = true
matchit = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cookie = { version = "0.18.1", features = ["percent-encode", "signed", "private", "key-expansion"] }
tracing.workspace = true
smallvec = "1.15"
flate2 = "1.1"
# `brotli`/`ruzstd` are optional because each backs one `DecompressionMiddleware` coding
# (`decompress-br`/`decompress-zstd`); both are pure Rust so the wasm32 build keeps all four
# codings. `flate2` is already linked for `CompressionMiddleware`, so gzip and deflate decode
# for free.
brotli = { version = "9", optional = true, default-features = false, features = ["std"] }
ruzstd = { version = "0.9", optional = true, default-features = false, features = ["std", "hash"] }
bytes = "1.11"
# UUIDv7 request ids: `std` for `Timestamp::now`, and on wasm the `js` feature drives
# `Date::now` + WebCrypto instead of `getrandom` (the `uuid` entry under the wasm32
# target adds it).
uuid = { version = "1", default-features = false, features = ["std", "v7"] }
ipnet = "2"
mime_guess = "2.0"
include_dir = "0.7"
skyzen-macros.workspace = true
base64 = { version = "0.22", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = "0.10"
# Session ids are 128 random bits; getrandom's `js` backend (wasm32 section) reaches WebCrypto.
getrandom = "0.2"
futures-util = { version = "0.3.32" }
futures-core = { version = "0.3.32" }
# The websocket session plumbing needs oneshot/mpsc channels on every target: wasm converts the
# socket's JS events into a stream, and native hands a failed session's socket back to the
# framework so it can still send a close frame.
futures-channel = { version = "0.3.32", optional = true }
multer = { version = "3.1", optional = true }
http = "1.4"
# `macros` is named here rather than inherited from `skyzen-core`: `skyzen::ToSchema` re-exports
# utoipa's *derive*, and a payload carried by `Json`/`Form`/`Query` is now required to implement
# the trait, so the derive is part of this crate's own public surface and cannot depend on another
# crate happening to switch it on.
utoipa = { version = "5.4", default-features = false, features = ["macros"] }
utoipa-redoc = "6.0"
utoipa-scalar = "0.3"
garde = { version = "0.22", features = ["derive", "email"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-tungstenite = { version = "0.33.0", optional = true }
color-eyre = "0.6"
linkme = "0.3"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
# Native-only dependencies (always available, not gated by features)
#
# `smol` is the executor for the `Send` background work the runtime owns — queue consumers and
# `WorkerContext::wait_until` — and `compio` is the runtime every serving thread runs.
executor-core = { workspace = true, features = ["smol", "compio"] }
# One compio runtime per core serves the application over `http-kit-io`'s compio driver; `net`
# is for the unix-socket transport that driver has no listener for, `time` for the runtime's
# own timers.
compio = { workspace = true, features = ["runtime", "net", "time", "io", "fs"] }
http-kit-io = { workspace = true, features = ["compio"] }
skyzen-h1.workspace = true
# One `SO_REUSEPORT` listener per serving thread, which `std` cannot configure.
socket2 = { version = "0.6.5", default-features = false, features = ["all"] }
# File-region bodies, so the static file server's responses can be sent with sendfile/splice.
http-kit = { workspace = true, features = ["fs"] }
blocking = { version = "1.7", default-features = false }
# The static file server's per-thread cache (`static-files`): an LRU of resolved files, cleared by
# filesystem notifications. FSEvents is the macOS backend; elsewhere notify picks inotify, kqueue
# or ReadDirectoryChangesW on its own.
lru = { version = "0.19.0", default-features = false, optional = true }
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"], optional = true }
async-io.workspace = true
# async-channel is always available on native (used by runtime) and is also
# available on WASM when the `sse` feature is enabled
async-channel = "2.5"
ctrlc.workspace = true
hyper = { version = "1.8", features = ["server", "http1", "http2"] }
http-body-util = "0.1.3"
# Optional native dependencies
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "signal"], optional = true }
skyzen-hyper.workspace = true
jsonwebtoken = { version = "10", optional = true, features = ["aws_lc_rs"] }
# The AWS Lambda adapter, which brings its own Tokio runtime; see the `lambda` feature.
skyzen-lambda = { workspace = true, optional = true }
# TLS termination (`server-tls` feature): rustls driven straight over the owned-buffer streams by
# `http-kit-tls`. The `aws_lc_rs` provider matches the AWS SDK's TLS stack, so the workspace
# resolves one crypto backend; the certificate/key pair is loaded with rustls's own PEM support.
http-kit-tls = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false, optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"], optional = true }
# The reverse proxy's upstream client (`proxy`): zenwave's native backend, HTTP/1.1 on
# `http-kit-h1` over the same `http-kit-io` sockets the server runs on, with a connection pool on
# each serving thread. zenwave refuses to build without a default backend; `native-compio` is the
# one whose runtime this crate already links, though the proxy only ever starts pools on the
# serving thread's own runtime.
zenwave = { git = "https://github.com/zen-rs/zenwave", branch = "deps/208-fork-sources", default-features = false, features = ["native-compio"], optional = true }
# HTTP/3 (`http3` feature): quiche over the same compio threads. quiche builds BoringSSL from
# source, so only a build that asks for HTTP/3 pays for it; `fs` lets a file-region body (static
# files) go out over a QUIC stream. A QUIC writer offers no pipe, so a proxied body reaches it as
# data frames and `pipe` is not needed.
http-kit-h3 = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false, features = ["quiche", "fs"], optional = true }

# Kernel TLS on Linux: after the handshake the kernel seals and opens the records, so file-region
# bodies go out through sendfile/splice, and the proxy splices bodies and tunnels between the
# client's connection and the upstream's.
[target.'cfg(target_os = "linux")'.dependencies]
# Pinning serving threads and steering connections to the CPU that received them, and the
# busy-poll socket options; whether to steer is `skyzen-core`'s `steering`, and the busy-poll ring
# registration its `busy-poll`, both of which `skyzen doctor` reads too.
libc = "0.2"
# `IOU_PBUF_RING_INC`, the flag the serving threads' receive ring registers with.
io-uring = { version = "0.7.16", default-features = false }
skyzen-core = { workspace = true, features = ["steering", "busy-poll"] }
http-kit-tls = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false, features = ["kernel"], optional = true }
zenwave = { git = "https://github.com/zen-rs/zenwave", branch = "deps/208-fork-sources", default-features = false, features = ["native-compio", "native-kernel-tls"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The `Server` tests and `examples/embed_hyper.rs` run their own smol executor.
smol.workspace = true
async-executor.workspace = true
async-tungstenite = { version = "0.33.0", features = ["tokio-runtime"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "signal", "net"] }
femme = "2.2.1"
# `tests/native_runtime.rs` builds the `native` example itself, so it runs under any test runner.
escargot = { version = "1.0.1", default-features = false }
skyzen-hyper.workspace = true
# The `Server` tests and `examples/embed_hyper.rs` hand a server listeners registered with an
# `http-kit-io` backend, and serve the same `!Send` router through both of Skyzen's servers.
http-kit-io = { workspace = true, features = ["async-io"] }
# `tests/migrations.rs` asserts that what `embed_migrations!` baked in is byte-for-byte what the
# shared reader produces, which means naming that reader directly.
skyzen-manifest.workspace = true
skyzen-services.workspace = true
# `InMemoryDb` — and therefore every `#[skyzen::test]` that takes a `Db` — needs the sqlx SQLite
# driver, which `skyzen-test` leaves to the consumer to choose. Picking it here is what lets
# `cargo test -p skyzen` run the migration tests without a feature flag on the command line.
skyzen-test = { workspace = true, features = ["sqlite"] }
# `tests/sql_rows.rs` binds and reads the parameter types `DbValue` carries, exactly as an
# application does: the types are named from their own crates, at the versions `skyzen-services`
# depends on, so cargo unifies them into the same ones the backends encode.
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"
tempfile = "3.25"
# Mints the self-signed certificate the `server-tls` tests hand the acceptor.
rcgen = "0.14"
futures-lite = "2.6"
serial_test = "3.2"
# The decompression tests encode their fixture zstd frames; `ruzstd` only decodes.
zstd = { version = "0.13", default-features = false }
# `tests/proxy.rs` drives the proxy with a raw HTTP/1.1 client, which sends and reads trailers and
# pulls a body only as fast as the test asks.
http-kit-h1.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The wasm half of the OpenAPI handler registry; see `src/openapi/registry.rs` for why
# native uses `linkme` and only wasm pays for `inventory`.
inventory = "0.3"
# `Key::generate()` (signed/private cookies) reaches WebCrypto through getrandom's js backend;
# without it the call would panic on a Worker.
getrandom = { version = "0.2", features = ["js"] }
# `js` makes `Uuid::now_v7` work on wasm32-unknown-unknown: `Date::now` for the
# timestamp and `crypto.getRandomValues` for the random bits.
uuid = { version = "1", default-features = false, features = ["std", "v7", "js"] }
wasm-bindgen = { version = "0.2.110", features = ["spans"] }
wasm-bindgen-futures = "0.4.60"
js-sys = "0.3.87"
wasm-streams = "0.5"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3.87", features = ["Request", "RequestInit", "Response", "ResponseInit", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamDefaultController", "WebSocket"] }

# `serde_html_form` rather than `serde_urlencoded`: it deserializes repeated keys
# (`tags=a&tags=b`) into `Vec<_>`, which the query and form extractors both need.
[dependencies.serde_html_form]
version = "0.4"
optional = true

# Typed header parsing (`TypedHeader<H>`) and the conditional/range headers the static file
# server needs.
[dependencies.twox-hash]
version = "2.1"
default-features = false
features = ["xxhash3_64", "std"]

[dependencies.headers]
version = "0.4"

[dependencies.itoa]
version = "1.0"
optional = true

[dependencies.async-channel]
version = "2.5"
optional = true

[dependencies.pin-project-lite]
version = "0.2.16"
optional = true


# The worker example exports a Durable Object, and `#[skyzen::durable_object]` expands to the
# Cloudflare class wrapper, which lives in `skyzen-cloudflare`. A dev-dependency is the one
# direction the cycle is allowed in: the platform crate depends on this one, and only the
# example reaches back.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
skyzen-cloudflare = { path = "cloudflare" }

[features]
default = [
    "json",
    "form",
    "query",
    "multipart",
    "sse",
    "rt",
    "openapi",
    "ws",
    "static-files",
    "decompress-gzip",
    "decompress-deflate",
    "decompress-br",
    "decompress-zstd",
]
openapi = ["skyzen-core/openapi", "skyzen-macros/openapi"]
auth = []
jwt = ["auth", "dep:jsonwebtoken"]
json = ["http-kit/json"]
# The `query` feature enables the `Query` extractor without pulling in form bodies.
query = ["dep:serde_html_form"]
form = ["dep:serde_html_form", "query"]
multipart = ["dep:multer", "dep:pin-project-lite"]
sse = ["dep:itoa", "dep:async-channel", "dep:pin-project-lite"]
# The static file server emits and honours `ETag`, `Last-Modified` and `Range`, which it parses
# and renders with the `headers` crate rather than by hand.
static-files = ["dep:sha1", "dep:base64", "dep:lru", "dep:notify"]
# `TypedHeader<H>` plus the `skyzen::headers` re-export. `headers` itself is a required
# dependency — the conditional-request types use it unconditionally — so the feature only
# marks the API surface.
typed-header = []
# `Valid<E>` — `garde` validation on decoded payloads.
validate = ["dep:garde"]
# Request-body decompression codings for `DecompressionMiddleware`, one feature per
# `Content-Encoding` token it can decode. gzip and deflate ride on `flate2`, already linked
# for response compression; `br` and `zstd` each pull their pure-Rust decoder.
decompress-gzip = ["decompress"]
decompress-deflate = ["decompress"]
decompress-br = ["decompress", "dep:brotli"]
decompress-zstd = ["decompress", "dep:ruzstd"]
# Internal: on whenever any `decompress-*` coding is, so the streaming decoder machinery is
# compiled exactly when some coding uses it. Not meant to be enabled directly.
decompress = []
# Database drivers and TLS backends. None is on by default: an application picks the ones it uses,
# and each forwards to the `skyzen-services` feature of the same name. sqlx runs on its
# runtime-neutral runtime, so there is no runtime to pick.
postgres = ["skyzen-services/postgres"]
mysql = ["skyzen-services/mysql"]
sqlite = ["skyzen-services/sqlite"]
tls-native-tls = ["skyzen-services/tls-native-tls"]
tls-rustls = ["skyzen-services/tls-rustls"]
tls-none = ["skyzen-services/tls-none"]
ws = [
    "json",
    "dep:futures-channel",
    "dep:base64",
    "dep:sha1",
    "dep:async-tungstenite",  # Only compiles on native (target-specific dep)
]
# The `rt` feature enables the built-in runtime for `#[skyzen::main]`.
# On native targets: provides logging, signal handling (ctrl+c), and serves HTTP on one compio runtime per core.
# On WASM targets: no-op (WASM already runs in a runtime and uses WinterCG APIs).
rt = []
# Terminate TLS in the native server: `--tls-cert`/`--tls-key` (or `SKYZEN_TLS_CERT`/
# `SKYZEN_TLS_KEY`) point the runtime at a PEM certificate chain and private key, and
# `#[skyzen::main]` serves HTTPS on the bound listener with ALPN `h2, http/1.1`.
server-tls = ["dep:http-kit-tls", "dep:rustls"]
# The reverse-proxy endpoint (`skyzen::proxy`, native only), forwarding through zenwave's native
# backend.
proxy = ["dep:zenwave"]
# Serve HTTP/3 (QUIC, on quiche) on UDP beside the TLS listener, on its port and with its
# certificate and key; the TLS responses advertise it with `Alt-Svc`. `--http3` or
# `SKYZEN_HTTP3` additionally makes a start where it cannot be served an error.
http3 = ["server-tls", "dep:http-kit-h3"]
# The `lambda` feature lets `#[skyzen::main]` serve AWS Lambda invocations.
# Nothing in an application changes: the runtime detects `AWS_LAMBDA_RUNTIME_API` and hands over
# to the adapter instead of binding a listener. Without it, a binary that finds itself inside
# Lambda refuses to start rather than serving a port nothing can reach.
lambda = ["dep:skyzen-lambda"]
# The `hyper` feature provides the Hyper server adapter (`skyzen::hyper`).
# Use this when embedding Skyzen into your own application with a custom runtime.
# You only need to bring your own tokio runtime; no need to import hyper or hyper-util directly.
# Note: `skyzen-hyper` is a plain native dependency — the built-in runtime installs its
# `hyper::rt::Timer` rather than carrying a second copy — so this feature only controls whether
# the adapter is re-exported as `skyzen::hyper`.
hyper = []

[[example]]
name = "embed_hyper"
required-features = ["hyper"]

# The native half of the example serves `NativeDurableNamespace`, which needs the `sqlite` driver.
[[example]]
name = "worker"
required-features = ["sqlite"]

[[test]]
name = "hyper_websocket"
required-features = ["sqlite"]

[[test]]
name = "proxy"
required-features = ["proxy"]

# Serves one router through both servers, Hyper's among them.
[[test]]
name = "server"
required-features = ["hyper"]

[lints]
workspace = true
