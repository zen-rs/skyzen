[package]
name = "skyzen-aws"
version = "0.1.0"
edition = "2021"
description = "AWS service implementations for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["aws", "dynamodb", "sqs", "skyzen", "services"]
categories = ["web-programming::http-server", "database"]

[dependencies]
skyzen-services = { path = "../services", version = "0.1.0" }
skyzen-s3 = { path = "../s3", version = "0.1.0", optional = true }
aws-config = "1"
# Disable the SDK default `rustls` feature: it pulls the legacy `tls-rustls` connector
# (rustls 0.21 / hyper-rustls 0.24), which is redundant with the modern `default-https-client`
# (rustls-aws-lc) and carries unpatched RustSec advisories. The default HTTPS client is unaffected.
aws-sdk-dynamodb = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-sqs = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-rdsdata = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
# Only for `SqsDeduplication::ContentHash`, which needs a stable digest of a message body to build
# a FIFO `MessageDeduplicationId`.
sha2 = { version = "0.10", optional = true }
serde_json = { version = "1", optional = true }
# The same tokenizer `skyzen-services` rewrites placeholders with, so the RDS Data API's second
# rewriting pass sees exactly the same string literals and comments the first one did.
sqlparser = { version = "0.58", optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# The parameter types `DbValue` carries, needed to build one of every variant in the mapping tests.
# Versions match `skyzen-services`, so the types are the same ones its `DbValue` holds.
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"

[features]
default = ["dynamodb", "rds-data", "s3", "sqs"]
dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-smithy-types"]
rds-data = [
    "dep:aws-sdk-rdsdata",
    "dep:aws-smithy-types",
    "dep:serde_json",
    "dep:sqlparser",
    "dep:tracing",
]
s3 = ["dep:skyzen-s3"]
sqs = ["dep:aws-sdk-sqs", "dep:aws-smithy-types", "dep:base64", "dep:sha2"]

[lints]
workspace = true
