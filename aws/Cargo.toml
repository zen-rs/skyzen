[package]
name = "skyzen-aws"
version = "0.1.0"
edition = "2021"
description = "AWS service implementations for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["aws", "dynamodb", "sqs", "skyzen", "services"]
categories = ["web-programming::http-server", "database"]

[dependencies]
skyzen-services = { path = "../services", version = "0.1.0" }
skyzen-s3 = { path = "../s3", version = "0.1.0", optional = true }
aws-config = "1"
# Disable the SDK default `rustls` feature: it pulls the legacy `tls-rustls` connector
# (rustls 0.21 / hyper-rustls 0.24), which is redundant with the modern `default-https-client`
# (rustls-aws-lc) and carries unpatched RustSec advisories. The default HTTPS client is unaffected.
aws-sdk-dynamodb = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-sqs = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
base64 = { version = "0.22", optional = true }

[features]
default = ["dynamodb", "s3", "sqs"]
dynamodb = ["dep:aws-sdk-dynamodb"]
s3 = ["dep:skyzen-s3"]
sqs = ["dep:aws-sdk-sqs", "dep:base64"]

[lints]
workspace = true
