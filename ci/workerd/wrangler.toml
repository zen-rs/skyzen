name = "skyzen-worker"
main = "worker.mjs"
compatibility_date = "2024-10-01"
workers_dev = true

[[rules]]
type = "ESModule"
globs = ["**/*.mjs", "**/*.js"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# The worker example's Durable Object; `VisitsObject` is the class `#[skyzen::durable_object]`
# exports for `Visits`, re-exported by name from `worker.mjs`.
[[durable_objects.bindings]]
name = "VISITS"
class_name = "VisitsObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitsObject"]
