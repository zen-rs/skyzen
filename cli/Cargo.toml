[package]
name = "skyzen-cli"
version = "0.2.1"
edition = "2021"
description = "Unified local emulation and deployment CLI for Skyzen"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["skyzen", "cli", "serverless", "deploy"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "skyzen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "0.16"
# The Lambda environment is delivered in-process rather than through `cargo lambda`, so a value
# never reaches a command line. Same feature selection as `skyzen-aws`, so the workspace resolves
# one HTTP stack: the SDK default `rustls` feature pulls the legacy connector (rustls 0.21 /
# hyper-rustls 0.24) alongside the modern `default-https-client`, and carries unpatched advisories.
aws-config = "1"
aws-sdk-lambda = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctrlc = "3.5"
dotenvy = "0.15"
flate2 = "1.1"
ignore = "0.4"
notify-debouncer-full = "0.4"
# `skyzen openapi` hands the rendered page to the user's browser. The page is a local file, so
# this is the whole of the CLI's involvement with a browser: no server, no port.
open = "5"
pathdiff = "0.2"
regex = "1"
# The Azure app settings are read and written over ARM, which has no Rust SDK for the Web Apps
# provider; same rustls-only selection as `skyzen-azure` so the workspace resolves one TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For `OPENAPI_DUMP_ENV`, the contract between `skyzen openapi` and a running application.
# Naming it from the crate that defines it is what keeps the two halves from drifting.
skyzen-core.workspace = true
skyzen-manifest.workspace = true
# `skyzen migrate --provider native` applies migrations itself rather than shelling out, so the CLI
# links the same runner and the same sqlx drivers the application would use. `runtime-tokio-rustls`
# picks sqlx's primary runtime; the CLI drives it on a current-thread runtime of its own.
skyzen-services = { workspace = true, features = ["runtime-tokio-rustls"] }
tokio = { version = "1.49", features = ["rt", "net", "time"] }
toml = "1.0"
toml_edit = "0.22"
# `wasm-bindgen-cli-support` requires `wasm-bindgen-shared = "=0.2.120"`, so pinning the same
# exact version here makes cargo unify the two: `wasm_bindgen_shared::version()` is then
# guaranteed by the resolver to be the version of the generator this binary embeds. That is what
# the build-time and `skyzen doctor` agreement checks compare the application's resolved
# `wasm-bindgen` against, and what `skyzen new` pins into generated projects.
wasm-bindgen-cli-support = "=0.2.120"
wasm-bindgen-shared = "=0.2.120"
wasm-opt = "0.116"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
