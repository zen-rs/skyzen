[package]
name = "skyzen-cli"
version = "0.1.0"
edition = "2021"
description = "Unified local emulation and deployment CLI for Skyzen"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["skyzen", "cli", "serverless", "deploy"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "skyzen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ctrlc = "3.5"
ignore = "0.4"
notify-debouncer-full = "0.4"
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "1.0"
toml_edit = "0.22"
wasm-bindgen-cli-support = "=0.2.120"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
