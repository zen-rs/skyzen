[package]
name = "skyzen-cli"
version = "0.7.0"
edition = "2021"
description = "Unified local emulation and deployment CLI for Skyzen"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["skyzen", "cli", "serverless", "deploy"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "skyzen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "0.16"
# The Lambda environment is delivered in-process rather than through `cargo lambda`, so a value
# never reaches a command line. The CLI runs on tokio, so it keeps the SDK's tokio client; the SDK
# default `rustls` feature stays off because it pulls the legacy connector (rustls 0.21 /
# hyper-rustls 0.24) alongside the modern `default-https-client`, and carries unpatched advisories.
aws-config = "1"
aws-sdk-lambda = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
# `[static_files] precompress`: the `.br` and `.zst` siblings `skyzen build` writes beside each
# file `StaticDir` serves (`.gz` comes from `flate2`, below).
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
zstd = { version = "0.14.3", default-features = false }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctrlc = "3.5"
dotenvy = "0.15"
flate2 = "1.1"
ignore = "0.4"
notify-debouncer-full = "0.4"
# `skyzen openapi` hands the rendered page to the user's browser. The page is a local file, so
# this is the whole of the CLI's involvement with a browser: no server, no port.
open = "5"
pathdiff = "0.2"
regex = "1"
# The Azure app settings are read and written over ARM, which has no Rust SDK for the Web Apps
# provider; zenwave is the workspace's HTTP client — hyper over async-io with rustls verified
# against the OS trust store, the same selection `skyzen-azure` makes.
zenwave = { git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false, features = ["hyper-backend", "rustls", "http2"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For `OPENAPI_DUMP_ENV`, the contract between `skyzen openapi` and a running application.
# Naming it from the crate that defines it is what keeps the two halves from drifting.
skyzen-core.workspace = true
skyzen-manifest.workspace = true
# `skyzen migrate --provider native` applies migrations itself rather than shelling out, so the CLI
# links the same runner and the same sqlx drivers the application would use. `tls-rustls` picks
# sqlx's TLS stack; sqlx's runtime-neutral runtime runs under the CLI's own current-thread runtime.
skyzen-services = { workspace = true, features = ["postgres", "mysql", "sqlite", "tls-rustls"] }
tokio = { version = "1.49", features = ["rt", "net", "time"] }
toml = "1.0"
toml_edit = "0.22"
# `wasm-bindgen-cli-support` requires `wasm-bindgen-shared = "=0.2.120"`, so pinning the same
# exact version here makes cargo unify the two: `wasm_bindgen_shared::version()` is then
# guaranteed by the resolver to be the version of the generator this binary embeds. That is what
# the build-time and `skyzen doctor` agreement checks compare the application's resolved
# `wasm-bindgen` against, and what `skyzen new` pins into generated projects.
wasm-bindgen-cli-support = "=0.2.120"
wasm-bindgen-shared = "=0.2.120"
wasm-opt = "0.116"

[target.'cfg(unix)'.dependencies]
# `user`: `geteuid`, for the deployment's root check.
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "user"] }

# `skyzen doctor`'s report of the Linux acceleration facilities (`src/host/linux.rs`), and
# `skyzen deploy --provider native`'s configuration of them (`src/host/linux/apply.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
# NIC features (`tls-hw-*-offload`) and ring parameters (`tcp-data-split`) over ethtool's generic
# netlink family, read and written, on the CLI's tokio runtime; `futures-util` reads its reply
# streams. ethtool 0.4.0 writes only pause and channel settings; the branch adds the feature and
# ring set requests a deployment needs, proposed upstream.
ethtool = { git = "https://github.com/lexoliu/ethtool", branch = "feature-ring-set", default-features = false, features = ["tokio_socket"] }
futures-util = { version = "0.3.31", default-features = false }
# The steering decision, and whether an io_uring accepts a NAPI registration, each read exactly as
# the runtime reads it.
skyzen-core = { workspace = true, features = ["steering", "busy-poll"] }
# `RLIMIT_MEMLOCK` through `getrlimit(2)`, which bounds the pages zero-copy sends pin; `socket`
# and `net`: the `TCP_ULP` option through which the kernel loads its `tls` module.
nix = { version = "0.31.3", default-features = false, features = ["resource", "socket", "net"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
