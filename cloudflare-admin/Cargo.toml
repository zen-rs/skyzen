[package]
name = "skyzen-cloudflare-admin"
version = "0.1.0"
edition = "2024"
description = "Shared Cloudflare API response envelope types and token-source configuration for building Cloudflare control-plane tooling"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "../README.md"
keywords = ["cloudflare", "api", "dns", "access", "workers"]
categories = ["api-bindings", "web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
