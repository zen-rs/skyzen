[package]
name = "skyzen-cloudflare"
version = "0.1.1"
edition = "2021"
description = "Cloudflare Workers service implementations for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["cloudflare", "workers", "skyzen", "services"]
categories = ["web-programming::http-server", "wasm"]

[dependencies]
skyzen = { path = "..", version = "0.1.2", default-features = false, features = ["ws"] }
skyzen-services = { path = "../services", version = "0.1.0" }
worker-sys = { version = "0.7", features = ["d1", "queue"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "ReadableStream", "WritableStream", "TransformStream", "Headers", "Response"] }
wasm-streams = "0.5"
futures-core = "0.3"
bytes = "1.11"
serde_json = "1"
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
thiserror = "2"
worker = "0.7"

[lints]
workspace = true
