[package]
name = "skyzen-core"
version = "0.2.1"
edition = "2021"
description = "Foundational extractor/responder traits for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["http", "web", "framework"]
categories = ["web-programming::http-server"]

[dependencies]
http-kit.workspace = true
executor-core = { workspace = true, default-features = false }
utoipa = { version = "5.4", optional = true, default-features = false, features = ["macros"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
tracing = { workspace = true, optional = true }
secrecy = { version = "0.10", optional = true }
# The `Server` trait is written against http-kit-io's listener traits; the drivers themselves are
# left to the server implementations.
http-kit-io = { workspace = true, optional = true }
# The one-slot channel an `OnUpgrade` token carries its session in.
async-channel = { version = "2.5", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
futures-lite = "2.6"

[lints]
workspace = true

[features]
default = ["std"]
std = ["dep:serde", "dep:serde_json", "dep:tracing", "dep:secrecy", "dep:http-kit-io", "dep:async-channel"]
openapi = ["std", "dep:utoipa"]
