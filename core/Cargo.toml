[package]
name = "skyzen-core"
version = "0.3.0"
edition = "2021"
description = "Foundational extractor/responder traits for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["http", "web", "framework"]
categories = ["web-programming::http-server"]

[dependencies]
http-kit.workspace = true
executor-core = { workspace = true, default-features = false }
utoipa = { version = "5.4", optional = true, default-features = false, features = ["macros"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
tracing = { workspace = true, optional = true }
secrecy = { version = "0.10", optional = true }
# The `Server` trait is written against http-kit-io's listener traits; the drivers themselves are
# left to the server implementations.
http-kit-io = { workspace = true, optional = true }
# The one-slot channel an `OnUpgrade` token carries its session in.
async-channel = { version = "2.5", optional = true, default-features = false, features = ["std"] }

# The process's CPU affinity mask, which `steering` judges the NIC queue layout against.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", optional = true, default-features = false, features = ["sched"] }
# `busy_poll`: the `struct io_uring_napi` a ring is registered with and the probe ring `skyzen
# doctor` registers; `libc` makes the `io_uring_register(2)` call on a ring the runtime's compio
# driver owns, which `io-uring`'s `Submitter` cannot be built for.
io-uring = { version = "0.7.16", optional = true, default-features = false, features = ["io_safety"] }
libc = { version = "0.2.191", optional = true, default-features = false }

[dev-dependencies]
futures-lite = "2.6"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.25"

[lints]
workspace = true

[features]
default = ["std"]
std = ["dep:serde", "dep:serde_json", "dep:tracing", "dep:secrecy", "dep:http-kit-io", "dep:async-channel"]
openapi = ["std", "dep:utoipa"]
# `steering`: whether the native runtime steers connections on this machine, shared by the runtime
# and `skyzen doctor`. Linux only; elsewhere it enables nothing.
steering = ["std", "dep:nix"]
# `busy-poll`: registering an io_uring for NAPI busy polling, shared by the native runtime and
# `skyzen doctor`. Linux only; elsewhere it enables nothing.
busy-poll = ["std", "dep:io-uring", "dep:libc"]
