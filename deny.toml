# Supply-chain policy for cargo-deny (https://embarkstudios.github.io/cargo-deny/).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[advisories]
ignore = [
    # Pulled via reqsign / optional sqlx-mysql; upstream has no fixed version yet.
    "RUSTSEC-2023-0071",
    # Marked unmaintained; pulled via notify-debouncer-full in skyzen-cli.
    "RUSTSEC-2024-0384",
    # Marked unmaintained; pulled via askama_derive in skyzen-cli.
    "RUSTSEC-2026-0374",
    # Marked unmaintained; pulled via humantime-serde in skyzen-manifest.
    "RUSTSEC-2026-0542",
    # Marked unmaintained; pulled via sqlx, worker, and skyzen-services.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Aligned with workspace clippy.multiple_crate_versions = "allow".
multiple-versions = "allow"
# Git dependencies in workspace manifests omit `version`, which cargo-deny
# treats as wildcard dependencies.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/lexoliu/compio",
    "https://github.com/lexoliu/ethtool",
    "https://github.com/lexoliu/executor-core",
    "https://github.com/lexoliu/quiche",
    "https://github.com/zen-rs/http-kit",
    "https://github.com/zen-rs/zenwave",
]
