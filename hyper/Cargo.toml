[package]
name = "skyzen-hyper"
version = "0.3.0"
edition = "2021"
description = "Hyper server backend for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["http", "web", "framework"]
categories = ["web-programming::http-server"]

[dependencies]
skyzen-core.workspace = true
http-kit.workspace = true
futures-util = "0.3.32"
http-body = "1.0"
http-body-util = "0.1.3"
executor-core.workspace = true
http-kit-io.workspace = true
tracing.workspace = true
async-io.workspace = true
# Closing a channel is the broadcast that stops every connection, and the last dropped sender is
# the signal that they have all drained.
async-channel = "2.5"

[dependencies.hyper]
features = ["server", "http1", "http2"]
version = "1.8"
default-features = false

[dev-dependencies]
smol.workspace = true
futures-lite = "2.6"
async-executor.workspace = true
# The same server on a readiness driver, on tokio's and on the completion driver thread-per-core
# runs on.
http-kit-io = { workspace = true, features = ["async-io", "tokio", "compio"] }
executor-core = { workspace = true, features = ["compio", "tokio"] }
tokio = { version = "1.49", features = ["rt"] }
http-kit = { workspace = true, features = ["fs"] }
tempfile = "3.25"
# HTTP/2 over TLS with ALPN, and HTTP/3 beside it, against one self-signed certificate.
futures-rustls = "0.26"
rcgen = "0.14"
hyper = { version = "1.8", default-features = false, features = ["client", "http1", "http2"] }
smol-hyper = "0.1"
http-kit-h3 = { git = "https://github.com/zen-rs/http-kit", branch = "main", features = ["quiche"] }

[lints]
workspace = true
