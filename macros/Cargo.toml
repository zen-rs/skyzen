[package]
name = "skyzen-macros"
version = "0.2.1"
edition = "2024"
description = "Procedural macros powering the Skyzen web framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["http", "web", "framework"]
categories = ["web-programming::http-server"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
# The manifest schema is shared with the CLI so a `Skyzen.toml` section can never be understood
# one way at compile time and another at deploy time. A proc-macro crate may depend on a plain
# library crate; only the reverse is restricted.
skyzen-manifest.workspace = true
syn = { version = "2", features = ["full"] }

[dev-dependencies]

[lints]
workspace = true
