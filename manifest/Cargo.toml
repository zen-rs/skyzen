[package]
name = "skyzen-manifest"
version = "0.1.0"
edition = "2021"
description = "Typed Skyzen.toml schema shared by the Skyzen CLI and the Skyzen procedural macros"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["skyzen", "manifest", "config", "serverless"]
categories = ["config", "development-tools"]

[dependencies]
hex = "0.4"
humantime-serde = "1.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
