[package]
name = "skyzen-redis"
version = "0.2.0"
edition = "2021"
description = "Redis implementation of KeyValueStore for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["redis", "key-value", "skyzen", "services"]
categories = ["web-programming::http-server", "database"]

[dependencies]
skyzen-services = { path = "../services", version = "0.2.0" }
# `script` is what `compare_and_swap` runs on: Redis has no compare-and-swap command, and a
# GET/SET pair is not atomic. It brings in `sha1_smol` for the EVALSHA cache key.
redis = { version = "1", default-features = false, features = ["aio", "connection-manager", "script"], optional = true }

[features]
default = ["runtime-tokio"]
# User selects async runtime in their application. The `redis` dependency is
# only pulled in once a runtime is picked: `redis`'s `aio` support does not
# compile without one of its `*-comp` features, so with neither runtime
# selected this crate compiles to an empty shell instead of failing to build.
runtime-tokio = ["dep:redis", "redis/tokio-comp"]
runtime-smol = ["dep:redis", "redis/smol-comp"]

[lints]
workspace = true
