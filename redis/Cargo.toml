[package]
name = "skyzen-redis"
version = "0.3.1"
edition = "2021"
description = "Redis implementation of KeyValueStore for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["redis", "key-value", "skyzen", "services"]
categories = ["web-programming::http-server", "database"]

[dependencies]
skyzen-services = { path = "../services", version = "0.3.1", default-features = false }
# `script` is what `compare_and_swap` runs on: Redis has no compare-and-swap command, and a
# GET/SET pair is not atomic. It brings in `sha1_smol` for the EVALSHA cache key.
redis = { version = "1", default-features = false, features = ["aio", "connection-manager", "script"], optional = true }
# Upstream `tls-rustls` deliberately enables no crypto provider — `rustls/std` and
# system roots only — so without this dep a `rediss://` URL parses but
# `ClientConfig::builder()` panics at connect. Cargo feature unification hands
# the provider to the same `rustls` package redis links; aws-lc-rs matches the
# rest of the workspace.
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "aws_lc_rs"] }

[features]
default = ["runtime-tokio"]
# User selects async runtime in their application. The `redis` dependency is
# only pulled in once a runtime is picked: `redis`'s `aio` support does not
# compile without one of its `*-comp` features, so with neither runtime
# selected this crate compiles to an empty shell instead of failing to build.
runtime-tokio = ["dep:redis", "redis/tokio-comp"]
runtime-smol = ["dep:redis", "redis/smol-comp"]
# `rediss://` URLs negotiate TLS through rustls. Upstream's TLS method exists
# per-runtime and `tls-rustls` demands the comp of EVERY enabled runtime — a
# per-runtime split would leave combinations like `runtime-tokio`+`tls-smol`
# unbuildable, so one `tls` feature pulls both comps; the `runtime-*` features
# still pick which stack runs (a `runtime-smol`-only build pins `prefer_smol`
# at first connect). rustls only, matching the rest of the workspace; there is
# no `native-tls` variant.
tls = ["dep:rustls", "redis/tokio-rustls-comp", "redis/smol-rustls-comp"]

[dev-dependencies]
# Enables `ring` alongside `aws_lc_rs` on the shared `rustls` in test builds, so
# the provider test lives in the multi-provider world a consumer can land in —
# where a bare `ClientConfig::builder()` panics without an installed default.
# `--no-dev-deps` builds are unaffected.
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread"] }
# `tls-rustls-insecure` lets the handshake test accept a self-signed peer via
# `rediss://…#insecure`; verification stays on for every other URL. The two
# comps come along because upstream `tls-rustls` requires a rustls comp for
# every enabled runtime — without them `cargo test` (no `tls`) would not
# compile at all.
redis = { version = "1", features = [
    "tokio-rustls-comp",
    "smol-rustls-comp",
    "tls-rustls-insecure",
] }

[lints]
workspace = true
