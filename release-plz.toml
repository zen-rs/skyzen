[workspace]
pr_draft = false
# The next version is decided by the conventional commits alone. release-plz would also run
# cargo-semver-checks, which builds the published baseline crate afresh under `RUSTC_BOOTSTRAP`;
# that baseline resolves rustix 0.37, whose `rustc_*` layout attributes the current stable
# refuses, so the check cannot build and took the whole release with it on 2026-09-17.
semver_check = false
pr_labels = ["release"]
git_release_name = "{{ package }}-v{{ version }}"
publish = true
git_tag_enable = true
changelog_update = true

# The framework, its macros, the Cloudflare crates and the CLI are one version line: the CLI
# emulates and deploys the framework it is built against, and a fix anywhere in the line ships a
# CLI whose prebuilt binaries carry it. Without the group a fix outside `cli/` bumps only the
# crate it touched, and no skyzen-cli tag — so no binaries build — follows.
[[package]]
name = "skyzen"
version_group = "skyzen"
git_release_name = "v{{ version }}"
git_tag_name = "v{{ version }}"

#
# Every other crate is tagged `<dir>/v<version>`, `<dir>` being its top-level directory. The
# main crate's `v<version>` tag is the one that triggers the CLI's binaries: cargo-dist reads a
# `<name>/v<version>` tag as a package name that must be a Cargo package, and `<dir>` is not.
[[package]]
name = "skyzen-cli"
version_group = "skyzen"
git_tag_name = "cli/v{{ version }}"

[[package]]
name = "skyzen-cloudflare"
version_group = "skyzen"
git_tag_name = "cloudflare/v{{ version }}"

[[package]]
name = "skyzen-cloudflare-admin"
version_group = "skyzen"
git_tag_name = "cloudflare-admin/v{{ version }}"

[[package]]
name = "skyzen-core"
git_tag_name = "core/v{{ version }}"

[[package]]
name = "skyzen-h1"
git_tag_name = "h1/v{{ version }}"

[[package]]
name = "skyzen-hyper"
git_tag_name = "hyper/v{{ version }}"

[[package]]
name = "skyzen-lambda"
git_tag_name = "lambda/v{{ version }}"

[[package]]
name = "skyzen-macros"
version_group = "skyzen"
git_tag_name = "macros/v{{ version }}"

[[package]]
name = "skyzen-manifest"
git_tag_name = "manifest/v{{ version }}"

[[package]]
name = "skyzen-services"
git_tag_name = "services/v{{ version }}"

[[package]]
name = "skyzen-test"
git_tag_name = "test/v{{ version }}"

[[package]]
name = "skyzen-redis"
git_tag_name = "redis/v{{ version }}"

[[package]]
name = "skyzen-s3"
git_tag_name = "s3/v{{ version }}"

[[package]]
name = "skyzen-aws"
git_tag_name = "aws/v{{ version }}"

[[package]]
name = "skyzen-azure"
git_tag_name = "azure/v{{ version }}"

# A runnable example, not a published crate: it must not get a version bump, a tag or a changelog.
#
# `publish` has to be restated even though `release = false` already covers it: the workspace
# default above is `publish = true`, and release-plz validates that flag against each crate's own
# `Cargo.toml` *before* it looks at whether the package is released at all. Leaving them to
# disagree aborts the whole run — no crate is published, which is what happened to the releases on
# 2026-08-27 and 2026-08-29.
[[package]]
name = "skyzen-example-queue-consumer"
release = false
publish = false
