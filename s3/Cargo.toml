[package]
name = "skyzen-s3"
version = "0.1.0"
edition = "2021"
description = "S3-compatible ObjectStorage implementation for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["s3", "object-storage", "skyzen", "services"]
categories = ["web-programming::http-server", "database"]

[dependencies]
skyzen-services = { path = "../services", version = "0.1.0" }
# Disable the SDK default `rustls` feature: it pulls the legacy `tls-rustls` connector
# (rustls 0.21 / hyper-rustls 0.24), which is redundant with the modern `default-https-client`
# (rustls-aws-lc) and carries unpatched RustSec advisories. The default HTTPS client is unaffected.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
] }
aws-config = { version = "1" }
# `byte-stream-poll-next` exposes `ByteStream::poll_next`, which is what lets `get_stream` wrap a
# response body in a `futures_core::Stream` newtype instead of buffering the whole object.
aws-smithy-types = { version = "1", features = ["byte-stream-poll-next"] }
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
http-kit.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
