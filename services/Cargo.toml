[package]
name = "skyzen-services"
version = "0.1.0"
edition = "2021"
description = "Portable service abstractions for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["http", "web", "framework", "services"]
categories = ["web-programming::http-server"]

[dependencies]
skyzen-core = { path = "../core", version = "0.1.1" }
http-kit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-core = "0.3"
bytes = "1"
sqlparser = "0.58"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { version = "0.8", default-features = false, features = ["json", "chrono", "uuid", "bigdecimal"], optional = true }

[features]
# All native sqlx drivers are enabled by default; disable default features and
# pick individual drivers to trim compile times.
default = ["postgres", "mysql", "sqlite"]
# Runtime features - user selects in their application
runtime-tokio-native-tls = ["sqlx/runtime-tokio-native-tls"]
runtime-tokio-rustls = ["sqlx/runtime-tokio-rustls"]
runtime-async-std-native-tls = ["sqlx/runtime-async-std-native-tls"]
runtime-async-std-rustls = ["sqlx/runtime-async-std-rustls"]
# Database backends (native targets only; each forwards to the sqlx driver)
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dev-dependencies]
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
