[package]
name = "skyzen-services"
version = "0.2.1"
edition = "2021"
description = "Portable service abstractions for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["http", "web", "framework", "services"]
categories = ["web-programming::http-server"]

[dependencies]
skyzen-core = { path = "../core", version = "0.2.1" }
http-kit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-core = "0.3"
bytes = "1"
# The queue envelope codec (`queue::envelope`), which tags a body a text-only transport could not
# otherwise carry.
base64 = "0.22"
sqlparser = "0.58"
tracing.workspace = true
# Migration checksums are recorded in the database as hex. Hashing happens at build time (in
# `skyzen-manifest`, where the files are read); this crate only ever renders and compares, so it
# needs the encoder and not the hash.
hex = "0.4"
# The parameter types `DbValue` carries. These are named directly rather than through
# `sqlx::types` because `DbValue` must exist on wasm32, where sqlx is not compiled at all; the
# versions are the ones sqlx 0.9 re-exports, so cargo unifies them into one crate and a bound
# `DateTime`/`Uuid`/`BigDecimal` is the same type sqlx's `Encode` impls expect.
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"
bigdecimal = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { version = "0.9", default-features = false, features = ["json", "chrono", "uuid", "bigdecimal"], optional = true }

[features]
# All native sqlx drivers are enabled by default; disable default features and
# pick individual drivers to trim compile times.
default = ["postgres", "mysql", "sqlite"]
# Runtime features - user selects in their application. sqlx 0.9 splits the
# runtime from the TLS stack, so each is picked independently; a backend needing
# TLS (postgres, mysql) compiles only once a tls-* feature is on, while sqlite
# needs no TLS at all.
runtime-tokio = ["sqlx/runtime-tokio"]
runtime-async-std = ["sqlx/runtime-async-std"]
tls-native-tls = ["sqlx/tls-native-tls"]
tls-rustls = ["sqlx/tls-rustls"]
tls-none = ["sqlx/tls-none"]
# Database backends (native targets only; each forwards to the sqlx driver)
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dev-dependencies]
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
