[package]
name = "skyzen-test"
version = "0.3.2"
edition = "2021"
description = "Testing utilities and mock implementations for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["http", "web", "framework", "testing"]
categories = ["web-programming::http-server", "development-tools::testing"]

[dependencies]
skyzen-core.workspace = true
skyzen-services = { path = "../services", version = "0.3.1", default-features = false }
http-kit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Matches the encoder `skyzen`'s `Form` extractor and responder use, so a payload with a
# repeated key round-trips through the test client the way it does through the framework.
serde_html_form = "0.4"
insta = { version = "1", features = ["json"] }

[dev-dependencies]
# The tests run on a compio runtime, the one the native server runs.
compio = { version = "0.19.2", default-features = false, features = ["runtime", "macros"] }

[features]
# `InMemoryDb` and `InMemoryDurableDb` run on SQLite over sqlx (SQLite uses no TLS, so none is
# selected). Enabling this feature is what makes them exist.
sqlite = ["skyzen-services/sqlite"]

[lints]
workspace = true
