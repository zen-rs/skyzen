[package]
name = "skyzen-test"
version = "0.2.1"
edition = "2021"
description = "Testing utilities and mock implementations for the Skyzen framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zen-rs/skyzen"
readme = "README.md"
keywords = ["http", "web", "framework", "testing"]
categories = ["web-programming::http-server", "development-tools::testing"]

[dependencies]
skyzen-core.workspace = true
skyzen-services = { path = "../services", version = "0.2.1", default-features = false }
http-kit.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Matches the encoder `skyzen`'s `Form` extractor and responder use, so a payload with a
# repeated key round-trips through the test client the way it does through the framework.
serde_html_form = "0.4"
insta = { version = "1", features = ["json"] }

[dev-dependencies]
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }

[features]
# `InMemoryDb` runs on SQLite over sqlx, which needs a runtime (SQLite uses no TLS,
# so none is selected). Enabling this feature is what makes `InMemoryDb` exist.
runtime-tokio = ["skyzen-services/runtime-tokio", "skyzen-services/sqlite"]

[lints]
workspace = true
